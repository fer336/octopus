name: CMS Deploy

on:
  push:
    tags:
      - "cms-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a deployar (ej: cms-v1.2.3)"
        required: true

permissions:
  contents: write
  packages: write

env:
  EFFECTIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & Push CMS
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/octopustrack-cms
            ${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-cms
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/cms-v') && !contains(env.EFFECTIVE_TAG, '-') }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push CMS
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octopustrack-cms:${{ env.EFFECTIVE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-cms:${{ env.EFFECTIVE_TAG }}
            ghcr.io/${{ github.repository_owner }}/octopustrack-cms:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-cms:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms
          build-args: |
            APP_VERSION=${{ env.EFFECTIVE_TAG }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Export image digest
        run: echo "cms=${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  github-release:
    name: Create CMS Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/cms-v')

    steps:
      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          generate_release_notes: true
          body: |
            ## CMS publicado

            | Registry | Imagen |
            |---|---|
            | GHCR | `ghcr.io/${{ github.repository_owner }}/octopustrack-cms:${{ env.EFFECTIVE_TAG }}` |
            | Docker Hub | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-cms:${{ env.EFFECTIVE_TAG }}` |

            ## Cómo actualizar en Portainer
            1. En el stack del CMS, actualizá la variable `IMAGE_TAG` a `${{ env.EFFECTIVE_TAG }}`
            2. Hacé **Redeploy**

  deploy:
    name: Deploy CMS to Swarm
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/cms-v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Portainer webhook
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_CMS_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Portainer webhook CMS retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Webhook CMS disparado correctamente (HTTP $HTTP_STATUS)"

      - name: Verify CMS deployment health
        run: |
          echo "Esperando 20s para que el swarm redespliegue..."
          sleep 20

          MAX_RETRIES=6
          RETRY_DELAY=10
          URL="${{ secrets.CMS_HEALTH_URL }}"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Intento $i/$MAX_RETRIES — GET $URL"
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "CMS saludable (HTTP 200) — deploy exitoso"
              exit 0
            fi

            echo "CMS no disponible (HTTP $STATUS), reintentando en ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "El servicio CMS no respondió después de $MAX_RETRIES intentos"
          exit 1