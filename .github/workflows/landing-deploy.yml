name: Landing Deploy

on:
  push:
    tags:
      - "landing-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a deployar (ej: landing-v1.2.3)"
        required: true

permissions:
  contents: write

env:
  EFFECTIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    name: Build & Push Landing Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/octopustrack-landing
            ${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-landing
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/landing-v') && !contains(env.EFFECTIVE_TAG, '-') }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.landing.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          no-cache: true
          build-args: |
            VITE_TENANT_LOGIN_URL=${{ vars.VITE_TENANT_LOGIN_URL }}
            VITE_OCTOPUS_TRACK_LOGIN_URL=${{ vars.VITE_OCTOPUS_TRACK_LOGIN_URL }}
            VITE_OCTOPUS_FLOW_LOGIN_URL=${{ vars.VITE_OCTOPUS_FLOW_LOGIN_URL }}
            APP_VERSION=${{ env.EFFECTIVE_TAG }}

  github-release:
    name: Create Landing Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/landing-v')

    steps:
      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          generate_release_notes: true
          body: |
            ## Landing publicada

            | Registry | Imagen |
            |---|---|
            | GHCR | `ghcr.io/${{ github.repository_owner }}/octopustrack-landing:${{ env.EFFECTIVE_TAG }}` |
            | Docker Hub | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-landing:${{ env.EFFECTIVE_TAG }}` |

            ## Cómo actualizar en Portainer (Landing)
            1. En el stack de landing, actualizá la variable `IMAGE_TAG` a `${{ env.EFFECTIVE_TAG }}`
            2. Hacé **Redeploy**

  deploy:
    name: Deploy Landing via Portainer Webhook
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/landing-v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Portainer webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_LANDING_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_LANDING_WEBHOOK_URL no configurado. Se omite deploy."
            exit 0
          fi

          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_LANDING_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Landing webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Landing webhook disparado correctamente (HTTP $HTTP_STATUS)"
