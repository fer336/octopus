name: Landing CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/landing.html'
      - 'frontend/src/landing/**'
      - 'frontend/src/pages/Landing.tsx'
      - 'frontend/src/components/ui/Button.tsx'
      - 'frontend/src/styles/**'
      - 'frontend/public/**'
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/Dockerfile.landing.prod'
      - 'frontend/nginx/landing.conf'
      - '.github/workflows/landing-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Landing Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-landing
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.landing.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_TENANT_LOGIN_URL=${{ vars.VITE_TENANT_LOGIN_URL }}
            VITE_LANDING_WHATSAPP_URL=${{ vars.VITE_LANDING_WHATSAPP_URL }}

  deploy:
    name: Deploy Landing via Portainer Webhook
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.PORTAINER_LANDING_WEBHOOK_URL != '' }}
    steps:
      - name: Trigger Portainer webhook
        run: |
          curl -fsSL -X POST "${{ secrets.PORTAINER_LANDING_WEBHOOK_URL }}"
