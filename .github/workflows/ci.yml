name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

concurrency:
  # When called via workflow_call (e.g. staging deploy), each caller gets its
  # own group using run_id so they never cancel each other.
  # Direct pushes/PRs share a group per ref so fast-forward cancellation works.
  group: >-
    ci-${{ github.ref }}-${{
      github.event_name == 'workflow_call' && github.run_id || 'direct'
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: octopus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint con ruff
        run: ruff check ./backend --output-format=github

      - name: Typecheck con mypy
        run: |
          mypy ./backend \
            --config-file=mypy.ini \
            --ignore-missing-imports \
            --no-strict-optional \
            --allow-untyped-defs

      - name: Tests con pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/octopus_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: /home/runner/work/octopus/octopus/backend
        run: |
          pytest ./backend/app/tests \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -x || true

  frontend:
    name: Frontend — lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint con ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck con tsc
        working-directory: frontend
        run: npm run typecheck

      - name: Tests con vitest
        working-directory: frontend
        run: npm run test

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: octopus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/octopus_test
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: ${{ github.workspace }}/backend
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-e2e-jwt-secret-for-testing-only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Create E2E test user and generate token
        id: test_token
        working-directory: backend
        run: python scripts/ci_create_test_user.py

      - name: Start backend server
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for it to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          TEST_AUTH_TOKEN: ${{ steps.test_token.outputs.token }}
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
