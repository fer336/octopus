name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: octopus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint con ruff
        run: ruff check ./backend --output-format=github

      - name: Typecheck con mypy
        run: |
          mypy ./backend \
            --config-file=mypy.ini \
            --ignore-missing-imports \
            --no-strict-optional \
            --allow-untyped-defs

      - name: Tests con pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/octopus_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: /home/runner/work/octopus/octopus/backend
        run: |
          pytest ./backend/app/tests \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -x || true

  frontend:
    name: Frontend — lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint con ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck con tsc
        working-directory: frontend
        run: npm run typecheck

      - name: Tests con vitest
        working-directory: frontend
        run: npm run test
