name: System Staging Deploy

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: system-staging-deploy
  cancel-in-progress: true

env:
  EFFECTIVE_TAG: staging
  STAGING_BACKEND_URL: https://staging.octopustrack.shop
  STAGING_TENANT_API_URL: https://staging.octopustrack.shop/api/tenant

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & Push Staging — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image_name: octopustrack-backend

          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-frontend

          - service: cms
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-cms

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # CAMBIO 6: historial completo + tags. Sin esto, GitHub Actions clona shallow
        # y `git describe` falla por no encontrar el último tag estable.
        with:
          fetch-depth: 0

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # CAMBIO 7: versión pre-release SemVer derivada del último tag estable X.Y.Z.
          # Ej: si el último release es 1.6.1 y develop lleva 7 commits encima →
          #     1.6.1-7-gabc1234  ("7 commits por delante de 1.6.1, commit abc1234").
          # El --match filtra solo tags numéricos (ignora "staging", "develop", etc.).
          # El --always evita que falle si todavía no hay ningún tag (cae al short sha).
          VERSION="$(git describe --tags --match '[0-9]*.[0-9]*.[0-9]*' --always)"
          echo "Versión pre-release calculada: $VERSION"

          echo "tag=${{ env.EFFECTIVE_TAG }}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.docker_tags.outputs.tag }}
            type=raw,value=develop
            type=raw,value=${{ steps.docker_tags.outputs.version }}
            type=raw,value=${{ steps.docker_tags.outputs.sha_tag }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=staging-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.service }}
          build-args: |
            APP_VERSION=${{ steps.docker_tags.outputs.sha_tag }}
            BUILD_DATE=${{ steps.docker_tags.outputs.build_date }}
            GIT_SHA=${{ github.sha }}
            VITE_BACKEND_URL=${{ env.STAGING_BACKEND_URL }}
            VITE_API_URL=${{ env.STAGING_TENANT_API_URL }}

      - name: Export image digest
        run: |
          echo "## Imagen staging publicada — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Servicio | ${{ matrix.service }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | ${{ steps.docker_tags.outputs.tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | ${{ steps.build.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy System Staging to Swarm
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docs/devops/stack.system.staging.yml
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|:-staging[^}]*}|:-staging-${SHORT_SHA}}|g" docs/devops/stack.system.staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/devops/stack.system.staging.yml
          if git diff --staged --quiet; then
            echo "Sin cambios en el stack file, nada que commitear."
          else
            git commit -m "chore: pin staging stack to staging-${SHORT_SHA} [skip ci]"
            git push origin develop
          fi

      - name: Trigger Portainer staging webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_STAGING_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_STAGING_WEBHOOK_URL no configurado"
            exit 1
          fi

          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_STAGING_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Portainer staging webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Webhook staging disparado correctamente. HTTP $HTTP_STATUS"

      # CAMBIO 5: mismo arreglo que en prod. El health check de staging ahora
      # REINTENTA y FALLA de verdad si no levanta, en vez de imprimir "revisá
      # Portainer manualmente" y salir en verde. Esto importa especialmente ahora
      # que los tests bloquean: querés que staging sea el lugar donde te enterás de
      # los problemas ANTES de sacar el tag de prod.
      - name: Verify staging deployment health
        run: |
          URL="${{ secrets.SYSTEM_STAGING_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::SYSTEM_STAGING_HEALTH_URL no configurado"
            exit 1
          fi
          echo "Verificando salud en: $URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deploy staging verificado correctamente. HTTP 200 (intento $i)"
              exit 0
            fi
            echo "Intento $i/10: HTTP $STATUS. Reintento en 15s..."
            sleep 15
          done
          echo "::error::Health check staging falló tras 10 intentos (último HTTP $STATUS)."
          exit 1
