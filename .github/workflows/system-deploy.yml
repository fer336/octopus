name: System Deploy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a deployar (con v). Ej: v1.2.19"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  EFFECTIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image_name: octopustrack-backend
            platforms: linux/amd64,linux/arm64

          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-frontend
            platforms: linux/amd64,linux/arm64

          - service: cms
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-cms
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        run: |
          RAW_TAG="${{ env.EFFECTIVE_TAG }}"

          # Validar formato vX.Y.Z
          if ! [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: $RAW_TAG"
            echo "Usá formato vX.Y.Z: v1.2.19, v1.3.0, etc."
            exit 1
          fi

          # Las imágenes Docker se etiquetan sin el prefijo "v" (convención habitual).
          VERSION="${RAW_TAG#v}"

          MINOR_TAG="$(echo "$VERSION" | cut -d. -f1,2)"

          IS_STABLE="true"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_STABLE="false"
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor_tag=$MINOR_TAG" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          echo "RAW_TAG=$RAW_TAG"
          echo "VERSION=$VERSION"
          echo "MINOR_TAG=$MINOR_TAG"
          echo "IS_STABLE=$IS_STABLE"
          echo "BUILD_DATE=$BUILD_DATE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.docker_tags.outputs.version }}
            type=raw,value=${{ steps.docker_tags.outputs.minor_tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.docker_tags.outputs.is_stable == 'true' }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Show generated image tags
        run: |
          echo "Tags generados:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            APP_VERSION=${{ steps.docker_tags.outputs.version }}
            BUILD_DATE=${{ steps.docker_tags.outputs.build_date }}
            GIT_SHA=${{ github.sha }}
            VITE_BACKEND_URL=https://app.octopustrack.shop
            VITE_API_URL=https://app.octopustrack.shop/api/tenant

      - name: Export image digest
        run: |
          echo "## Imagen publicada — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Servicio | ${{ matrix.service }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Versión Docker | ${{ steps.docker_tags.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | ${{ steps.build.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create System Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Compute Docker release tag
        id: release_tags
        shell: bash
        run: |
          # Las imágenes Docker no llevan el prefijo "v" del tag de git.
          RAW_TAG="${{ env.EFFECTIVE_TAG }}"
          VERSION="${RAW_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker release tag: $VERSION"

      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Imágenes del Sistema

            | Servicio | GHCR | Docker Hub |
            |---|---|---|
            | backend | `ghcr.io/${{ github.repository_owner }}/octopustrack-backend:${{ steps.release_tags.outputs.version }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-backend:${{ steps.release_tags.outputs.version }}` |
            | frontend | `ghcr.io/${{ github.repository_owner }}/octopustrack-frontend:${{ steps.release_tags.outputs.version }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-frontend:${{ steps.release_tags.outputs.version }}` |
            | cms | `ghcr.io/${{ github.repository_owner }}/octopustrack-cms:${{ steps.release_tags.outputs.version }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-cms:${{ steps.release_tags.outputs.version }}` |

            ## Tags publicados

            También se publican:

            - `${{ steps.release_tags.outputs.version }}`
            - `sha-xxxxxxx`

            ## Cómo actualizar en Portainer

            Portainer **debe** usar el tag de esta release, nunca `latest` —
            así cada deploy es reproducible y trazable a un release concreto:

            ```env
            IMAGE_TAG=${{ steps.release_tags.outputs.version }}
            ```

            `docs/devops/stack.system.yml` ya queda pineado a este valor por
            el job `pin-stack` de este mismo workflow, así que si Portainer
            sigue este archivo por git, no hace falta tocar nada a mano.

            Si hay cambios de schema, el backend corre migraciones automáticamente al iniciar:

            ```bash
            alembic upgrade heads
            ```

  pin-stack:
    name: Pin stack.system.yml to version
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Bookkeeping best-effort: si master está protegido y el bot no puede
    # pushear, no debe romper el pipeline ni bloquear el deploy.
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docs/devops/stack.system.yml
        run: |
          RAW_TAG="${{ env.EFFECTIVE_TAG }}"
          VERSION="${RAW_TAG#v}"
          # Reemplaza el tag de imagen (":latest" o un ":-X.Y.Z" previo) por
          # la versión de esta release, tanto en `${IMAGE_TAG:-...}` como en
          # un ":latest" literal.
          sed -i \
            -e "s|\${IMAGE_TAG:-[^}]*}|\${IMAGE_TAG:-${VERSION}}|g" \
            -e "s|octopustrack-backend:latest|octopustrack-backend:\${IMAGE_TAG:-${VERSION}}|" \
            -e "s|octopustrack-frontend:latest|octopustrack-frontend:\${IMAGE_TAG:-${VERSION}}|" \
            docs/devops/stack.system.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/devops/stack.system.yml
          if git diff --staged --quiet; then
            echo "Sin cambios en el stack file."
          else
            git commit -m "chore: pin production stack to ${VERSION} [skip ci]"
            git push origin master \
              || echo "::warning::Pin a master rechazado (rama protegida). Bookkeeping omitido; el deploy no depende de esto."
          fi

  # CAMBIO 2 (NUEVO JOB): backup de la base productiva ANTES de deployar/migrar.
  # Por qué: hoy no hay ninguna red de seguridad. El backend corre `alembic upgrade`
  # al arrancar (RUN_ALEMBIC_MIGRATIONS=true). Si una migración corrompe o traba datos
  # reales de clientes, no tenés a dónde volver: el código revierte fácil, la base no.
  # Este job hace un pg_dump y lo guarda como artifact ANTES de tocar producción.
  #
  # IMPORTANTE PARA EL AGENTE — ESTO REQUIERE CONFIGURACIÓN MANUAL:
  # La base NO debería ser pública, así que el dump se hace por SSH al host del Swarm,
  # ejecutando pg_dump dentro del contenedor de Postgres. Hay que crear estos secrets
  # en GitHub (Settings > Secrets and variables > Actions):
  #   - DEPLOY_SSH_HOST       : IP o host del servidor Swarm
  #   - DEPLOY_SSH_USER       : usuario SSH
  #   - DEPLOY_SSH_KEY        : clave privada SSH (contenido completo)
  #   - PG_CONTAINER_NAME     : nombre/patrón del contenedor de Postgres en el host
  #   - PG_DB / PG_USER       : base y usuario para el dump (o leelos del .env)
  # Mientras estos secrets no existan, este job FALLA A PROPÓSITO y frena el deploy a
  # prod. Es intencional: no querés migrar datos reales sin backup. En cuanto los
  # configures, deja de bloquear.
  backup-db:
    name: Backup DB productiva (pre-deploy)
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validar secrets de backup
        run: |
          missing=""
          [ -z "${{ secrets.DEPLOY_SSH_HOST }}" ] && missing="$missing DEPLOY_SSH_HOST"
          [ -z "${{ secrets.DEPLOY_SSH_USER }}" ] && missing="$missing DEPLOY_SSH_USER"
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]  && missing="$missing DEPLOY_SSH_KEY"
          [ -z "${{ secrets.PG_CONTAINER_NAME }}" ] && missing="$missing PG_CONTAINER_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets para el backup pre-deploy:$missing"
            echo "::error::Configuralos o el deploy a prod no avanza (es a propósito: no se migra sin backup)."
            exit 1
          fi

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dump de la base productiva
        env:
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
        run: |
          STAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          FILE="octopus-prod-${{ env.EFFECTIVE_TAG }}-${STAMP}.sql.gz"
          echo "Generando backup: $FILE"
          # Ejecuta pg_dump DENTRO del contenedor de Postgres en el host del Swarm.
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "docker exec \$(docker ps -qf name=${{ secrets.PG_CONTAINER_NAME }} | head -n1) \
             pg_dump -U \"${PG_USER:-postgres}\" \"${PG_DB:-octopustrack}\"" \
            | gzip > "$FILE"
          SIZE=$(wc -c < "$FILE")
          echo "Backup generado: $FILE ($SIZE bytes)"
          # Falla si el dump salió vacío o demasiado chico (algo salió mal).
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::El backup salió sospechosamente chico ($SIZE bytes). Abortando deploy."
            exit 1
          fi
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Guardar backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.EFFECTIVE_TAG }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

  deploy:
    name: Deploy System to Swarm
    runs-on: ubuntu-latest
    # CAMBIO 3: el deploy ahora también espera al backup. Antes solo dependía de
    # `publish`; si el backup falla, NO se deploya (no se migra sin red de seguridad).
    # CAMBIO 5: y espera a `pin-stack` — antes corrían en paralelo y el webhook a
    # Portainer podía dispararse ANTES de que el pin de versión llegara a master,
    # dejando el redeploy apuntando a la versión anterior. `pin-stack` sigue siendo
    # continue-on-error, así que si falla (p. ej. master protegido) igual no bloquea.
    needs: [publish, backup-db, pin-stack]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Portainer webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_WEBHOOK_URL no configurado"
            exit 1
          fi

          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Portainer webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Webhook system disparado correctamente. HTTP $HTTP_STATUS"

      # CAMBIO 4: el health check ahora REINTENTA y FALLA de verdad si no levanta.
      # ANTES: hacía un solo curl tras 30s y, si no daba 200, solo imprimía
      # "Revisá Portainer manualmente" y salía con 0 → un deploy que dejaba prod
      # caído te figuraba EN VERDE. Ahora reintenta 10 veces (≈2,5 min) y si nunca
      # responde 200, el workflow FALLA y te llega la notificación. El rollback real
      # de la versión lo hace Swarm vía healthcheck del stack (ver stack.system.yml).
      - name: Verify deployment health
        run: |
          URL="${{ secrets.SYSTEM_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::SYSTEM_HEALTH_URL no configurado"
            exit 1
          fi
          echo "Verificando salud en: $URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deploy verificado correctamente. HTTP 200 (intento $i)"
              exit 0
            fi
            echo "Intento $i/10: HTTP $STATUS. Reintento en 15s..."
            sleep 15
          done
          echo "::error::Health check falló tras 10 intentos (último HTTP $STATUS). Revisá Portainer / logs."
          exit 1
