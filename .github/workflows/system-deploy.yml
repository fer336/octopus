name: System Deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a deployar (sin v). Ej: 1.2.19"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  EFFECTIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image_name: octopustrack-backend
            platforms: linux/amd64,linux/arm64

          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-frontend
            platforms: linux/amd64,linux/arm64

          - service: cms
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-cms
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        run: |
          RAW_TAG="${{ env.EFFECTIVE_TAG }}"

          # Validar que sea formato numérico (sin v, sin system-)
          if ! [[ "$RAW_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: $RAW_TAG"
            echo "Usá formato numérico: 1.2.19, 1.3.0, etc."
            exit 1
          fi

          VERSION="$RAW_TAG"

          MINOR_TAG="$(echo "$VERSION" | cut -d. -f1,2)"

          IS_STABLE="true"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_STABLE="false"
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor_tag=$MINOR_TAG" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          echo "RAW_TAG=$RAW_TAG"
          echo "VERSION=$VERSION"
          echo "MINOR_TAG=$MINOR_TAG"
          echo "IS_STABLE=$IS_STABLE"
          echo "BUILD_DATE=$BUILD_DATE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.docker_tags.outputs.version }}
            type=raw,value=${{ steps.docker_tags.outputs.minor_tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.docker_tags.outputs.is_stable == 'true' }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Show generated image tags
        run: |
          echo "Tags generados:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            APP_VERSION=${{ steps.docker_tags.outputs.version }}
            BUILD_DATE=${{ steps.docker_tags.outputs.build_date }}
            GIT_SHA=${{ github.sha }}
            VITE_BACKEND_URL=https://app.octopustrack.shop
            VITE_API_URL=https://app.octopustrack.shop/api/tenant

      - name: Export image digest
        run: |
          echo "## Imagen publicada — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Servicio | ${{ matrix.service }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Versión Docker | ${{ steps.docker_tags.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | ${{ steps.build.outputs.digest }} |" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create System Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Compute Docker release tag
        id: release_tags
        shell: bash
        run: |
          VERSION="${{ env.EFFECTIVE_TAG }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker release tag: $VERSION"

      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Imágenes del Sistema

            | Servicio | GHCR | Docker Hub |
            |---|---|---|
            | backend | `ghcr.io/${{ github.repository_owner }}/octopustrack-backend:${{ steps.release_tags.outputs.version }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-backend:${{ steps.release_tags.outputs.version }}` |
            | frontend | `ghcr.io/${{ github.repository_owner }}/octopustrack-frontend:${{ steps.release_tags.outputs.version }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-frontend:${{ steps.release_tags.outputs.version }}` |
            | cms | `ghcr.io/${{ github.repository_owner }}/octopustrack-cms:${{ steps.release_tags.outputs.version }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-cms:${{ steps.release_tags.outputs.version }}` |

            ## Tags publicados

            También se publican:

            - `${{ steps.release_tags.outputs.version }}`
            - `latest`
            - `sha-xxxxxxx`

            ## Cómo actualizar en Portainer

            ### Opción recomendada para deploy automático

            Dejá el stack usando:

            ```env
            IMAGE_TAG=latest
            ```

            Y las imágenes:

            ```yaml
            image: ghcr.io/${{ github.repository_owner }}/octopustrack-backend:${IMAGE_TAG:-latest}
            image: ghcr.io/${{ github.repository_owner }}/octopustrack-frontend:${IMAGE_TAG:-latest}
            ```

            Luego hacé **Redeploy** o usá el webhook.

            ### Opción versionada

            Si querés fijar una versión concreta:

            ```env
            IMAGE_TAG=${{ steps.release_tags.outputs.version }}
            ```

            Si hay cambios de schema, el backend corre migraciones automáticamente al iniciar:

            ```bash
            alembic upgrade heads
            ```

  deploy:
    name: Deploy System to Swarm
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Portainer webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "PORTAINER_WEBHOOK_URL no configurado"
            exit 1
          fi

          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Portainer webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Webhook system disparado correctamente. HTTP $HTTP_STATUS"

      - name: Verify deployment health
        run: |
          sleep 30

          URL="${{ secrets.SYSTEM_HEALTH_URL }}"

          if [ -z "$URL" ]; then
            echo "SYSTEM_HEALTH_URL no configurado. Saltando verificación."
            exit 0
          fi

          echo "URL a verificar: $URL"

          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "Deploy verificado correctamente. HTTP 200"
          else
            echo "Health check retornó HTTP $STATUS. Revisá Portainer manualmente."
          fi
