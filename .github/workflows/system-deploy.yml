name: System Deploy

on:
  push:
    tags:
      - "system-v*.*.*"
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a deployar (ej: v1.2.3 o system-v1.2.3)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  EFFECTIVE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image_name: octopustrack-backend
            platforms: linux/amd64,linux/arm64

          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image_name: octopustrack-frontend
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(env.EFFECTIVE_TAG, '-') }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            APP_VERSION=${{ env.EFFECTIVE_TAG }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Export image digest
        run: echo "${{ matrix.service }}=${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  github-release:
    name: Create System Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/system-v')

    steps:
      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Imágenes del Sistema

            | Servicio | GHCR | Docker Hub |
            |---|---|---|
            | backend | `ghcr.io/${{ github.repository_owner }}/octopustrack-backend:${{ env.EFFECTIVE_TAG }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-backend:${{ env.EFFECTIVE_TAG }}` |
            | frontend | `ghcr.io/${{ github.repository_owner }}/octopustrack-frontend:${{ env.EFFECTIVE_TAG }}` | `${{ secrets.DOCKERHUB_USERNAME }}/octopustrack-frontend:${{ env.EFFECTIVE_TAG }}` |

            ## Cómo actualizar en Portainer (Sistema)
            1. En el stack del sistema, actualizá la variable `IMAGE_TAG` a `${{ env.EFFECTIVE_TAG }}`
            2. Hacé **Redeploy**
            3. Si hay cambios de schema en este release, corrés: `alembic upgrade head`

  deploy:
    name: Deploy System to Swarm
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/system-v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Portainer webhook
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}")

          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Portainer webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Webhook disparado correctamente (HTTP $HTTP_STATUS)"

      - name: Verify deployment health
        run: |
          sleep 30
          URL="${{ secrets.SYSTEM_HEALTH_URL }}"

          if [ -z "$URL" ]; then
            echo "⚠️ SYSTEM_HEALTH_URL no configurado, saltando verification"
            exit 0
          fi

          echo "URL a verificar: $URL"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "✅ Deploy verificado (HTTP 200)"
          else
            echo "⚠️  Health check retornó HTTP $STATUS — revisá Portainer manualmente"
          fi
