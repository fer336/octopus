services:
  backend:
    image: ferc33/octopustrack-backend:v1.2.16
    networks:
      - network_public
      - octopus-internal
    secrets:
      - source: octopus_backend_env
        target: /run/secrets/backend.env
    environment:
      BACKEND_ENV_FILE: /run/secrets/backend.env
      DEBUG: "false"
      API_TENANT_PREFIX: "/api/tenant"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.octopus-tenant-api.rule=Host(`octopus.qeva.xyz`) && PathPrefix(`/api/tenant`)"
        - "traefik.http.routers.octopus-tenant-api.entrypoints=websecure"
        - "traefik.http.routers.octopus-tenant-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-tenant-api.priority=100"
        - "traefik.http.routers.octopus-tenant-api.service=octopus-backend"
        - "traefik.http.routers.octopus-admin-api.rule=Host(`octopus.qeva.xyz`) && PathPrefix(`/api/admin`)"
        - "traefik.http.routers.octopus-admin-api.entrypoints=websecure"
        - "traefik.http.routers.octopus-admin-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-admin-api.priority=100"
        - "traefik.http.routers.octopus-admin-api.service=octopus-backend"
        - "traefik.http.routers.octopus-auth.rule=Host(`octopus.qeva.xyz`) && PathPrefix(`/auth`)"
        - "traefik.http.routers.octopus-auth.entrypoints=websecure"
        - "traefik.http.routers.octopus-auth.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-auth.priority=110"
        - "traefik.http.routers.octopus-auth.service=octopus-backend"
        - "traefik.http.services.octopus-backend.loadbalancer.server.port=8000"

  frontend:
    image: ferc33/octopustrack-frontend:v1.2.16
    networks:
      - network_public
      - octopus-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.octopus-erp.rule=Host(`octopus.qeva.xyz`)"
        - "traefik.http.routers.octopus-erp.entrypoints=websecure"
        - "traefik.http.routers.octopus-erp.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-erp.middlewares=octopus-erp-entry@swarm"
        - "traefik.http.routers.octopus-erp.priority=5"
        - "traefik.http.routers.octopus-erp.service=octopus-frontend-erp"
        - "traefik.http.routers.octopus-cms.rule=Host(`cms-octopus.qeva.xyz`)"
        - "traefik.http.routers.octopus-cms.entrypoints=websecure"
        - "traefik.http.routers.octopus-cms.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-cms.middlewares=octopus-cms-entry@swarm"
        - "traefik.http.routers.octopus-cms.priority=5"
        - "traefik.http.routers.octopus-cms.service=octopus-frontend-cms"
        - "traefik.http.middlewares.octopus-erp-entry.replacepathregex.regex=^/$$"
        - "traefik.http.middlewares.octopus-erp-entry.replacepathregex.replacement=/tenant.html"
        - "traefik.http.middlewares.octopus-cms-entry.replacepathregex.regex=^/$$"
        - "traefik.http.middlewares.octopus-cms-entry.replacepathregex.replacement=/admin.html"
        - "traefik.http.services.octopus-frontend-erp.loadbalancer.server.port=80"
        - "traefik.http.services.octopus-frontend-cms.loadbalancer.server.port=80"

networks:
  network_public:
    external: true
    name: network_public
  octopus-internal:
    driver: overlay
    internal: true

secrets:
  octopus_backend_env:
    external: true
