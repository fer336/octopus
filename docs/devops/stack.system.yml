# stack.system.yml — Sistema OctopusTrack Producción
#
# CAMBIOS EN ESTE ARCHIVO (vs. original):
#   - Se agregó `healthcheck` a backend y frontend.
#   - Se agregó `update_config` (con failure_action: rollback) y `rollback_config`
#     al backend y al frontend.
# Por qué juntos: el `failure_action: rollback` SOLO se dispara si Swarm sabe que la
# tarea nueva está "unhealthy". Sin un `healthcheck`, Swarm considera "sana" a cualquier
# tarea que simplemente arranque, aunque la app esté caída por dentro. Con healthcheck +
# rollback, si la versión nueva no responde sano, Swarm vuelve SOLO a la anterior.
#
# OJO PARA EL AGENTE — confirmá antes de aplicar:
#   1. La RUTA real del endpoint de salud del backend (acá se asume `/health` en :8000).
#   2. Que la imagen del backend tenga Python (sí: es FastAPI) → uso urllib, no curl,
#      porque muchas imágenes Python no traen curl.
#   3. La imagen del frontend: se asume nginx en :80 con `wget` disponible (alpine lo trae).
#      Si no, ajustá el test del healthcheck.

version: "3.9"

services:
  backend:
    image: ghcr.io/fer336/octopustrack-backend:${IMAGE_TAG:-1.7.7}
    networks:
      - network_public
      - octopus-internal
    secrets:
      - source: octopus_backend_env
        target: /run/secrets/backend.env
    environment:
      BACKEND_ENV_FILE: /run/secrets/backend.env
      DEBUG: "false"
      API_TENANT_PREFIX: "/api/tenant"
      RUN_ALEMBIC_MIGRATIONS: "true"
    # CAMBIO: healthcheck del backend. Usa urllib (Python ya está en la imagen).
    # Ajustá la ruta `/health` si tu endpoint real es otro (ej: /api/v1/health).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else sys.exit(1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      # CAMBIO: rollback automático. start-first levanta la nueva antes de bajar la
      # vieja (sin downtime); si la nueva no pasa el healthcheck dentro de `monitor`,
      # Swarm ejecuta failure_action: rollback y vuelve a la versión anterior.
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
        delay: 10s
      rollback_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.octopus-tenant-api.rule=(Host(`app.octopustrack.shop`) || Host(`cms.octopustrack.shop`)) && PathPrefix(`/api/tenant`)"
        - "traefik.http.routers.octopus-tenant-api.entrypoints=websecure"
        - "traefik.http.routers.octopus-tenant-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-tenant-api.priority=100"
        - "traefik.http.routers.octopus-tenant-api.service=octopus-backend"
        - "traefik.http.routers.octopus-admin-api.rule=(Host(`app.octopustrack.shop`) || Host(`cms.octopustrack.shop`)) && PathPrefix(`/api/admin`)"
        - "traefik.http.routers.octopus-admin-api.entrypoints=websecure"
        - "traefik.http.routers.octopus-admin-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-admin-api.priority=100"
        - "traefik.http.routers.octopus-admin-api.service=octopus-backend"
        - "traefik.http.routers.octopus-auth.rule=(Host(`app.octopustrack.shop`) || Host(`cms.octopustrack.shop`)) && PathPrefix(`/auth`)"
        - "traefik.http.routers.octopus-auth.entrypoints=websecure"
        - "traefik.http.routers.octopus-auth.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-auth.priority=110"
        - "traefik.http.routers.octopus-auth.service=octopus-backend"

        - "traefik.http.routers.octopus-api-v1.rule=(Host(`app.octopustrack.shop`) || Host(`cms.octopustrack.shop`)) && PathPrefix(`/api/v1`)"
        - "traefik.http.routers.octopus-api-v1.entrypoints=websecure"
        - "traefik.http.routers.octopus-api-v1.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-api-v1.priority=100"
        - "traefik.http.routers.octopus-api-v1.service=octopus-backend"

        # Ruta dedicada para health check
        - "traefik.http.routers.octopus-health.rule=Host(`app.octopustrack.shop`) && Path(`/health`)"
        - "traefik.http.routers.octopus-health.entrypoints=websecure"
        - "traefik.http.routers.octopus-health.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-health.priority=110"
        - "traefik.http.routers.octopus-health.service=octopus-backend"

        - "traefik.http.services.octopus-backend.loadbalancer.server.port=8000"

  frontend:
    image: ghcr.io/fer336/octopustrack-frontend:${IMAGE_TAG:-1.7.7}
    networks:
      - network_public
      - octopus-internal
    # CAMBIO: healthcheck del frontend (nginx -t en vez de wget --spider).
    # nginx:alpine no incluye wget funcional, lo que hacía fallar el healthcheck.
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      # CAMBIO: mismo rollback automático que el backend.
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
        delay: 10s
      rollback_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.octopus-erp.rule=Host(`app.octopustrack.shop`)"
        - "traefik.http.routers.octopus-erp.entrypoints=websecure"
        - "traefik.http.routers.octopus-erp.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-erp.middlewares=octopus-erp-entry@swarm"
        - "traefik.http.routers.octopus-erp.priority=5"
        - "traefik.http.routers.octopus-erp.service=octopus-frontend-erp"
        - "traefik.http.routers.octopus-cms.rule=Host(`cms.octopustrack.shop`)"
        - "traefik.http.routers.octopus-cms.entrypoints=websecure"
        - "traefik.http.routers.octopus-cms.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-cms.middlewares=octopus-cms-entry@swarm"
        - "traefik.http.routers.octopus-cms.priority=5"
        - "traefik.http.routers.octopus-cms.service=octopus-frontend-cms"
        - "traefik.http.middlewares.octopus-erp-entry.replacepathregex.regex=^/$$"
        - "traefik.http.middlewares.octopus-erp-entry.replacepathregex.replacement=/tenant.html"
        - "traefik.http.middlewares.octopus-cms-entry.replacepathregex.regex=^/$$"
        - "traefik.http.middlewares.octopus-cms-entry.replacepathregex.replacement=/admin.html"
        - "traefik.http.services.octopus-frontend-erp.loadbalancer.server.port=80"
        - "traefik.http.services.octopus-frontend-cms.loadbalancer.server.port=80"

networks:
  network_public:
    external: true
    name: network_public
  octopus-internal:
    driver: overlay
    internal: true

secrets:
  octopus_backend_env:
    external: true
