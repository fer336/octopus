version: "3.9"

services:
  backend:
    image: ghcr.io/fer336/octopustrack-backend:${IMAGE_TAG:-latest}
    networks:
      - octopus_net
      - network_public
    environment:
      - ENVIRONMENT=production
      - APP_VERSION=${IMAGE_TAG:-unknown}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.octopus-backend.rule=Host(`api.octopus.qeva.xyz`)"
        - "traefik.http.routers.octopus-backend.entrypoints=websecure"
        - "traefik.http.routers.octopus-backend.tls.certresolver=letsencrypt"
        - "traefik.http.services.octopus-backend.loadbalancer.server.port=8000"

  frontend:
    image: ghcr.io/fer336/octopustrack-frontend:${IMAGE_TAG:-latest}
    networks:
      - network_public
    environment:
      - ENVIRONMENT=production
      - APP_VERSION=${IMAGE_TAG:-unknown}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.octopus-frontend.rule=Host(`octopus.qeva.xyz`)"
        - "traefik.http.routers.octopus-frontend.entrypoints=websecure"
        - "traefik.http.routers.octopus-frontend.tls.certresolver=letsencrypt"
        - "traefik.http.services.octopus-frontend.loadbalancer.server.port=80"

networks:
  octopus_net:
    driver: overlay
    attachable: true

  network_public:
    external: true
    name: network_public