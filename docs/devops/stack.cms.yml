# stack.cms.yml — CMS Admin Octopus
# URL raw para Portainer: https://raw.githubusercontent.com/fer336/octopus/master/docs/devops/stack.cms.yml
# En Portainer: Stack > Editor > pegar este contenido

version: "3.9"

services:
  cms:
    image: ghcr.io/fer336/octopustrack-cms:${IMAGE_TAG:-latest}
    networks:
      - octopus_net
      - traefik_public
    environment:
      - ENVIRONMENT=production
      - APP_VERSION=${IMAGE_TAG:-unknown}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.octopus-cms.rule=Host(`cms.tudominio.com`)"
        - "traefik.http.routers.octopus-cms.entrypoints=websecure"
        - "traefik.http.routers.octopus-cms.tls.certresolver=letsencrypt"
        - "traefik.http.services.octopus-cms.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  octopus_net:
    driver: overlay
    attachable: true
  traefik_public:
    external: true
    name: traefik_public