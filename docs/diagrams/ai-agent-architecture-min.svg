  <text class="s" x="214" y="141">texto/voz/imagen/pdf</text>

  <rect class="b" x="452" y="100" width="170" height="50" fill="#f1f5f9" stroke="#475569"/>
  <text class="l" x="475" y="130">POST /ai/chat</text>

  <rect class="b" x="668" y="94" width="180" height="62" fill="#dbeafe" stroke="#1d4ed8"/>
