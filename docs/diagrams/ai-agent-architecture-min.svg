  <rect class="b" x="962" y="90" width="220" height="112" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 5"/>
  <text class="l" x="980" y="116">State / Persistence</text>
  <text class="s" x="980" y="138">thread_id + checkpointer</text>
  <text class="s" x="980" y="156">quote_cart + missing_fields</text>
  <text class="s" x="980" y="174">preview_state</text>

