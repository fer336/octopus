<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">OctopusTrack AI Agent Architecture Minimal</title>
  <desc id="desc">Minimal overview of the AI agent orchestration and subgraphs.</desc>
  <defs>
    <style>
      .t { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .l { font: 600 13px Arial, sans-serif; fill: #0f172a; }
      .s { font: 500 11px Arial, sans-serif; fill: #334155; }
      .b { rx: 10; ry: 10; stroke-width: 2; }
      .a { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#fff"/>
  <text class="t" x="24" y="42">AI Agent Architecture (Minimal)</text>

  <rect class="b" x="26" y="100" width="120" height="50" fill="#dbeafe" stroke="#2563eb"/>
