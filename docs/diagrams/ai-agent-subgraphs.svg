<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1320" viewBox="0 0 1700 1320" role="img" aria-labelledby="title desc">
  <title id="title">OctopusTrack AI Agent Subgraphs</title>
  <desc id="desc">Detailed view of Catalog Discovery, Guided Quote, and System Help/Onboarding graphs.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
