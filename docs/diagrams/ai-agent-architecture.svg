<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">OctopusTrack AI Agent Architecture</title>
  <desc id="desc">Overview of LangGraph-based assistant with System Help, Catalog Discovery, and Guided Quote subgraphs.</desc>
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 12px Arial, sans-serif; fill: #334155; }
      .box { rx: 12; ry: 12; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4 L0,8 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="880" fill="#ffffff" />
  <text class="title" x="34" y="56">OctopusTrack AI Agent Architecture (LangGraph)</text>

