[mypy]
python_version = 3.12
ignore_missing_imports = True
no_strict_optional = True
allow_untyped_defs = True
warn_unused_ignores = False
exclude = alembic/|app/tests/

# Módulos con errores - ignorar temporalmente
[mypy-backend.app.services.afip_sdk_service]
ignore_errors = True

