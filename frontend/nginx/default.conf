# Server para CMS/Admin
server {
  listen 80;
  server_name cms.octopus.qeva.xyz;

  root /usr/share/nginx/html;
  index admin.html;

  location / {
    try_files $uri $uri/ /admin.html =404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }
}

# Server para Sistema/Tenant
server {
  listen 80;
  server_name octopus.qeva.xyz api.octopus.qeva.xyz;

  root /usr/share/nginx/html;
  index tenant.html;

  # Assets estáticos
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # ERP/Tenant - servir tenant.html
  location = /tenant.html {
    try_files $uri =404;
  }

  # Landing
  location = /landing.html {
    try_files $uri =404;
  }

  # Root - servir tenant.html
  location = / {
    try_files $uri /tenant.html =404;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}

# Fallback server
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index tenant.html;

  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}