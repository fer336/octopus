# Nginx con routing por Host - uno para cada dominio
server {
  listen 80;
  server_name cms-octopus.qeva.xyz;

  root /usr/share/nginx/html;
  index admin.html;

  # Servir admin.html
  location = /admin.html { try_files $uri =404; }

  # Assets
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Root → admin.html
  location = / {
    try_files $uri /admin.html =404;
  }

  # SPA fallback → admin.html
  location / {
    try_files $uri $uri/ /admin.html =404;
  }
}

server {
  listen 80;
  server_name octopus.qeva.xyz api.octopus.qeva.xyz;

  root /usr/share/nginx/html;
  index tenant.html;

  # Servir archivos específicos
  location = /tenant.html { try_files $uri =404; }
  location = /landing.html { try_files $uri =404; }

  # Assets
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Root → tenant.html
  location = / {
    try_files $uri /tenant.html =404;
  }

  # SPA fallback → tenant.html
  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}

# Fallback
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index tenant.html;

  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}