server {
  listen 80;
  server_name ~^cms;

  root /usr/share/nginx/html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /tenant.html { try_files $uri =404; }
  location = /admin.html  { try_files $uri =404; }

  location / {
    try_files $uri $uri/ /admin.html =404;
  }
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /tenant.html { try_files $uri =404; }
  location = /admin.html  { try_files $uri =404; }

  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}
