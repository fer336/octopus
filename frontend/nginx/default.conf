server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index tenant.html admin.html;

  # Assets estáticos - sin cache para dev
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # SPA routing - servir tenant.html por defecto
  location / {
    try_files $uri /tenant.html =404;
  }
}
