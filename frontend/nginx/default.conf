server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index tenant.html admin.html;

  # Assets estáticos
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Admin/CMS - servir admin.html
  location = /admin.html {
    try_files $uri =404;
  }

  # ERP/Tenant - servir tenant.html
  location = /tenant.html {
    try_files $uri =404;
  }

  # Landing pública
  location = /landing.html {
    try_files $uri =404;
  }

  # Root - servir tenant.html por defecto
  location = / {
    try_files $uri /tenant.html =404;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}
