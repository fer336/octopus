server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index tenant.html;

  # Assets estáticos
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Entrypoints multi-app
  location = / {
    return 302 /tenant.html;
  }

  location = /tenant.html {
    try_files $uri =404;
  }

  location = /admin.html {
    try_files $uri =404;
  }

  # Soporte para hash-routing de React
  location / {
    try_files $uri $uri/ /tenant.html;
  }
}
