server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index tenant.html admin.html;

  # Assets
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Servir archivos específicos
  location = /tenant.html { try_files $uri =404; }
  location = /admin.html { try_files $uri =404; }
  location = /landing.html { try_files $uri =404; }

  # Root - servir tenant.html por defecto
  location = / {
    try_files $uri /tenant.html =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /tenant.html =404;
  }
}