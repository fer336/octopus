server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index landing.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Archivos estáticos de SEO (NO SPA fallback)
  location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location = / {
    try_files $uri /landing.html =404;
  }

  location / {
    try_files $uri $uri/ /landing.html =404;
  }
}