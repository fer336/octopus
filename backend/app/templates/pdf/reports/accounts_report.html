{% extends "base_report.html" %}

{% block totals %}
<tfoot>
    <tr class="total-row">
        <td colspan="{{ headers|length if headers else 1 }}" style="text-align: center;">
            Clientes: {{ totals.get('Clientes', 0) }} &nbsp;·&nbsp;
            Deuda: ${{ "%.2f"|format(totals.get('Deuda', 0)) }} &nbsp;·&nbsp;
            A favor: ${{ "%.2f"|format(totals.get('A favor', 0)) }}
        </td>
    </tr>
</tfoot>
{% endblock %}
