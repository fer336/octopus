services:
  landing:
    image: ferc33/octopustrack-landing:latest
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.octopus-landing.rule=Host(`web-octopus.qeva.xyz`) || Host(`octopustrack.shop`) || Host(`www.octopustrack.shop`)"
        - "traefik.http.routers.octopus-landing.entrypoints=websecure"
        - "traefik.http.routers.octopus-landing.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.octopus-landing.priority=20"
        - "traefik.http.routers.octopus-landing.service=octopus-landing"
        - "traefik.http.services.octopus-landing.loadbalancer.server.port=80"

networks:
  network_public:
    external: true
    name: network_public
